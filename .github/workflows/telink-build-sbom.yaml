#
# Lean Telink build + SBOM pipeline.
#
# This is deliberately NOT a copy of .github/workflows/examples-telink.yaml:
# upstream builds 23 example targets, which is far more than needed to prove the
# toolchain works and to produce an SBOM. Start with one target, widen later.
#
# Note: the upstream examples-telink.yaml only triggers on master / v*-branch,
# so it never runs on dev-tlk_v1.5. This workflow exists to fill that gap.

name: Telink Build + SBOM

on:
    workflow_dispatch:
        inputs:
            board:
                description: "Zephyr board target"
                required: true
                default: tl3238x
            app:
                description: "Example source dir (relative to repo root)"
                required: true
                default: examples/lighting-app/telink
    push:
        branches:
            - dev-tlk_v1.5
            - 'ci/**'
        paths:
            - .github/workflows/telink-build-sbom.yaml
            - scripts/tools/telink/sbom_build.sh

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CHIP_NO_LOG_TIMESTAMPS: true

    # Matched pair from the tl_v1.5.0 release notes
    # (docs/platforms/telink/releases/telink_release_notes.md).
    # Upstream CI pins a slightly different tl_zephyr revision ("for developers
    # purpose"); this pins the released/validated pair instead so the SBOM has a
    # reproducible baseline.
    TELINK_ZEPHYR_URL: https://github.com/telink-semi/tl_zephyr.git
    TELINK_ZEPHYR_REV: 3b7996ad7645869aa2b1e6f2f16d56d03b8035a5
    TELINK_BLE_SDK_URL: https://github.com/telink-semi/tl_ble_sdk_zephyr.git
    TELINK_BLE_SDK_REV: eb0d12063db5606db8bca5526ce9b54c77c45797

jobs:
    build-sbom:
        name: Build + SBOM (${{ github.event.inputs.board || 'tl3238x' }})
        runs-on: ubuntu-latest

        container:
            # Ships the riscv64-zephyr-elf toolchain (Zephyr SDK 0.17.0), a
            # pre-cloned tl_zephyr plus all west modules and hal_telink blobs,
            # and exports TELINK_ZEPHYR_BASE / TELINK_ZEPHYR_SDK_DIR.
            #
            # Pinned by digest, not by the mutable :185 tag. The tag can be
            # repointed upstream at any time, which would silently change the
            # toolchain and make two SBOMs from the same commit incomparable.
            # Resolved 2026-11-03 from the :185 tag via the OCI registry API
            # (docker-content-digest). To bump deliberately:
            #   TOK=$(curl -s "https://ghcr.io/token?scope=repository:project-chip/chip-build-telink:pull&service=ghcr.io" | jq -r .token)
            #   curl -sI -H "Authorization: Bearer $TOK" \
            #     -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            #     https://ghcr.io/v2/project-chip/chip-build-telink/manifests/185 \
            #     | grep -i docker-content-digest
            image: ghcr.io/project-chip/chip-build-telink@sha256:144950e7fe7173953fa402768a5dac54d9deaac2313e510caaafdd64490ad58c

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            # Composite action; also prunes ~3GB off the runner (dotnet /
            # android SDK) which matters because the Matter tree plus a Zephyr
            # build is close to the default runner disk budget.
            # Its bootstrap cache backend is buildjet, which a fork may not have
            # credentials for -- both cache steps are continue-on-error, so the
            # worst case is a cold bootstrap.
            - name: Checkout submodules & Bootstrap
              uses: ./.github/actions/checkout-submodules-and-bootstrap
              with:
                  platform: telink

            - name: Pin Telink Zephyr SDK and fetch Telink BLE SDK
              run: |
                  scripts/run_in_build_env.sh "python3 scripts/tools/telink/update_zephyr.py \
                    $TELINK_ZEPHYR_URL $TELINK_ZEPHYR_REV \
                    --sdk-repo $TELINK_BLE_SDK_URL --sdk-hash $TELINK_BLE_SDK_REV"

            - name: Build example and generate SPDX SBOM
              run: |
                  ./scripts/run_in_build_env.sh "bash scripts/tools/telink/sbom_build.sh \
                    '${{ github.event.inputs.board || 'tl3238x' }}' \
                    '${{ github.event.inputs.app || 'examples/lighting-app/telink' }}' \
                    'out/telink-build' \
                    'out/sbom'"

            # DIAGNOSTIC (read-only, remove once answered).
            #
            # zspdx walks the CMake codemodel, so everything the Matter stack
            # builds via GN is invisible to it: the entire protocol stack shows
            # up as one opaque package with a commit SHA and FilesAnalyzed:
            # false. The GN invocation in config/common/cmake/chip_gn.cmake
            # already passes --add-export-compile-commands=*, so a compile
            # database should exist somewhere under the build tree. This step
            # finds out where, and what it contains.
            - name: Locate GN compile database
              if: always()
              run: |
                  echo "=== compile_commands.json anywhere under the build tree ==="
                  find . -name 'compile_commands.json' -type f 2>/dev/null | while read -r f; do
                    printf '   %-70s %s bytes\n' "$f" "$(stat -c%s "$f" 2>/dev/null)"
                  done
                  echo
                  echo "=== chip-gn external project directory ==="
                  find out -maxdepth 7 -type d -name 'chip-gn*' 2>/dev/null | head -10
                  echo
                  echo "=== .ninja files under the Matter build dir (shows it ran) ==="
                  find out -maxdepth 7 -name 'build.ninja' 2>/dev/null | head -10

            - name: Inspect GN compile database
              if: always()
              run: |
                  db="$(find . -name 'compile_commands.json' -type f 2>/dev/null | head -1)"
                  if [ -z "$db" ]; then
                    echo "NOT FOUND -- option A is not viable without a code change"
                    exit 0
                  fi
                  echo "using: $db"
                  python3 - "$db" <<'PY'
                  import json, sys, collections, os
                  entries = json.load(open(sys.argv[1]))

                  # GN emits paths relative to each entry's own "directory",
                  # so normalise before grouping -- otherwise the first pass
                  # collapsed everything into "../../..".
                  abs_files = []
                  for e in entries:
                      f = e.get("file", "")
                      d = e.get("directory", "")
                      abs_files.append(os.path.normpath(os.path.join(d, f)))

                  print(f"entries           : {len(entries)}")
                  print("distinct dirs     :", len({os.path.dirname(f) for f in abs_files}))
                  print()

                  # The repo root is the deepest common ancestor of the
                  # absolute paths.
                  root = os.path.commonpath(abs_files) if abs_files else ""
                  if not os.path.isdir(root):
                      root = os.path.commonpath([os.path.dirname(f) for f in abs_files])
                  print(f"inferred repo root: {root}")
                  print()

                  rel = [os.path.relpath(f, root) for f in abs_files]
                  print("compiled files by top-level area:")
                  areas = collections.Counter(p.split(os.sep)[0] for p in rel)
                  for k, n in areas.most_common(15):
                      print(f"   {n:5d}  {k}")

                  print()
                  print("Matter sources vs everything else:")
                  for label, pred in [
                      ("src/ (Matter stack)", lambda p: p.startswith("src" + os.sep)),
                      ("third_party/",         lambda p: p.startswith("third_party" + os.sep)),
                      ("_test / _fuzz files",  lambda p: "_test." in p or "_fuzz" in p or "test/" in p),
                  ]:
                      print(f"   {sum(1 for p in rel if pred(p)):5d}  {label}")

                  print()
                  print("sample NON-test entries (these are what we want):")
                  shown = 0
                  for p in rel:
                      if "_test." in p or "/test" in p or "_fuzz" in p:
                          continue
                      print("   ", p)
                      shown += 1
                      if shown >= 8:
                          break
                  if shown == 0:
                      print("    (none -- the database may only cover host tooling)")
                  PY

            # DIAGNOSTIC (read-only, remove once answered).
            #
            # The GN compile database is broader than the firmware: it carries
            # compile commands for every target in the GN build graph, while
            # ninja only builds the closure of //config/telink/chip-gn:telink.
            # That is why 415 of its 999 entries are test/fuzz files --
            # args.gni sets chip_build_tests = false, so those targets exist in
            # the graph but are not linked in.
            #
            # gn desc walks the dependency closure, so it can tell us which
            # files actually went into the firmware. This step finds out
            # whether gn desc is usable here and how big the closure is.
            - name: Probe GN dependency closure
              if: always()
              run: |
                  OUT=out/telink-build/modules/chip-module
                  ROOT=//config/telink/chip-gn:telink

                  echo "=== gn available? ==="
                  command -v gn && gn --version || echo "gn NOT on PATH"

                  echo
                  echo "=== GN out dir contents ==="
                  ls "$OUT" 2>/dev/null | head -20

                  echo
                  echo "=== project.json already present? ==="
                  ls -la "$OUT/project.json" 2>/dev/null \
                    || echo "absent -- gn gen was not run with --ide=json"

                  # gn must run inside the Matter build environment: BUILD.gn
                  # imports pigweed's pigweed_environment.gni, which resolves
                  # $_PW_ACTUAL_ENVIRONMENT_ROOT. Outside that environment the
                  # variable is empty and gn fails with
                  #   Unable to load "/build_overrides/pigweed_environment.gni"
                  # Redirects go inside the quoted command because
                  # run_in_build_env.sh prints its own banner to stdout.
                  echo
                  echo "=== direct deps of the root target ==="
                  ./scripts/run_in_build_env.sh \
                    "gn desc $OUT $ROOT --format=json --all-toolchains deps" \
                    2>&1 | head -30

                  echo
                  echo "=== root target's own sources (sanity check) ==="
                  ./scripts/run_in_build_env.sh \
                    "gn desc $OUT $ROOT --format=json --all-toolchains sources" \
                    2>&1 | head -20

                  echo
                  echo "=== closure via gn desc --tree ==="
                  rm -f /tmp/closure.json /tmp/closure.err
                  ./scripts/run_in_build_env.sh \
                    "gn desc $OUT $ROOT --format=json --all-toolchains deps --tree \
                       > /tmp/closure.json 2>/tmp/closure.err" || true
                  if [ -s /tmp/closure.json ]; then
                    echo "wrote $(stat -c%s /tmp/closure.json) bytes"
                  else
                    echo "gn desc --tree produced nothing; stderr:"
                    head -10 /tmp/closure.err
                  fi

            - name: Analyse GN closure
              if: always()
              run: |
                  if [ ! -s /tmp/closure.json ]; then
                    echo "no closure.json -- gn desc unusable, A2 needs --ide=json"
                    exit 0
                  fi
                  python3 - <<'PY'
                  import json, collections, os

                  try:
                      tree = json.load(open("/tmp/closure.json"))
                  except Exception as exc:
                      print("could not parse closure.json:", exc)
                      raise SystemExit(0)

                  labels = []
                  def walk(node):
                      if isinstance(node, dict):
                          for k, v in node.items():
                              labels.append(k)
                              walk(v)
                      elif isinstance(node, list):
                          for v in node:
                              walk(v)
                  walk(tree)
                  uniq = sorted(set(labels))
                  print(f"targets in closure : {len(uniq)}")
                  print()
                  print("by area:")
                  for k, n in collections.Counter(
                          l.split("//")[-1].split(":")[0].split("/")[0] for l in uniq
                      ).most_common(12):
                      print(f"   {n:5d}  {k}")
                  print()
                  print("sample targets:")
                  for l in uniq[:12]:
                      print("   ", l)
                  PY
            - name: Enrich SBOM for NTIA compliance
              run: |
                  python3 scripts/tools/telink/enrich_sbom.py out/sbom

            # Many customer-side SCA platforms ingest CycloneDX but not SPDX
            # tag-value. Convert from the enriched set so it carries the purl
            # and supplier fields.
            - name: Convert SBOM to CycloneDX
              run: |
                  python3 scripts/tools/telink/spdx_to_cyclonedx.py \
                    out/sbom/enriched -o out/sbom/telink-matter.cdx.json

            # Surfaces the components that need a human decision. In this build
            # that is ~12 of 21 real components; the other 121 packages are
            # CMake build targets and are counted but not listed.
            - name: Generate SBOM review artefacts
              run: |
                  python3 scripts/tools/telink/sbom_review.py \
                    out/sbom/enriched --out-dir out/sbom/review

            - name: Show SBOM summary
              if: always()
              run: |
                  echo "--- SPDX documents ---"
                  ls -la out/sbom 2>/dev/null || echo "(no SBOM directory produced)"
                  echo
                  for dir in out/sbom out/sbom/enriched; do
                    [ -d "$dir" ] || continue
                    echo "--- $dir ---"
                    printf '%-24s %8s %8s %8s\n' document packages supplier purl
                    for f in "$dir"/*.spdx; do
                      [ -e "$f" ] || continue
                      printf '%-24s %8s %8s %8s\n' "$(basename "$f")" \
                        "$(grep -c '^PackageName:' "$f" || true)" \
                        "$(grep -c '^PackageSupplier:' "$f" || true)" \
                        "$(grep -c '^ExternalRef:.*purl' "$f" || true)"
                    done
                    echo
                  done

            - name: Upload firmware
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: telink-firmware
                  if-no-files-found: warn
                  path: |
                      out/telink-build/zephyr/zephyr.elf
                      out/telink-build/zephyr/zephyr.bin
                      out/telink-build/zephyr/zephyr.map

            - name: Upload SBOM (raw, as emitted by zspdx)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: telink-sbom-spdx-raw
                  if-no-files-found: warn
                  path: out/sbom/*.spdx

            - name: Upload SBOM (enriched, NTIA-complete)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: telink-sbom-spdx-enriched
                  if-no-files-found: warn
                  path: out/sbom/enriched/*.spdx

            - name: Upload SBOM (CycloneDX)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: telink-sbom-cyclonedx
                  if-no-files-found: warn
                  path: out/sbom/*.cdx.json

            - name: Upload SBOM review artefacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: telink-sbom-review
                  if-no-files-found: warn
                  path: |
                      out/sbom/review/sbom-review.csv
                      out/sbom/review/sbom-gaps.md
